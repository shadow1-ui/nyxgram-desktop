name: Build Nyxgram Desktop (Windows x64)
on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      dependencies_only:
        description: 'Только подготовить зависимости, без EXE'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nyxgram-desktop-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: cmd
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
    steps:
      - name: Prepare separate build folders
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: TBuild/nyxgram-desktop
      - name: Free disk space without touching the Windows toolchain
        shell: pwsh
        run: |
          $unused = @($env:ANDROID_HOME, "$env:RUNNER_TOOL_CACHE\CodeQL", "$env:RUNNER_TOOL_CACHE\Java_Temurin-Hotspot", "$env:RUNNER_TOOL_CACHE\Go", "$env:RUNNER_TOOL_CACHE\Ruby", "$env:RUNNER_TOOL_CACHE\PyPy")
          foreach ($path in $unused) { if ($path -and (Test-Path $path)) { Remove-Item $path -Recurse -Force -ErrorAction Continue } }
          Get-PSDrive C,D | Select-Object Name,Free,Used
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Determine cache key and build mode
        shell: pwsh
        env:
          DEPS_ONLY: ${{ inputs.dependencies_only }}
        run: |
          $repo = "$env:TBUILD\nyxgram-desktop"
          $sdk = '10.0.26100.0'
          "SDK=$sdk" >> $env:GITHUB_ENV
          $hashes = @('Telegram/build/prepare/prepare.py','Telegram/build/qt_version.py') | ForEach-Object { (Get-FileHash "$repo/$_" -Algorithm SHA256).Hash }
          $bytes = [Text.Encoding]::UTF8.GetBytes(($hashes -join ':') + ':' + $sdk)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes))
          "CACHE_KEY=$hash" >> $env:GITHUB_ENV
          $hasApi = $env:API_ID -match '^[1-9][0-9]*$' -and $env:API_HASH -match '^[a-fA-F0-9]{32}$'
          $buildApp = $hasApi -and $env:DEPS_ONLY -ne 'true'
          "BUILD_APP=$($buildApp.ToString().ToLower())" >> $env:GITHUB_ENV
          if (!$hasApi) { Write-Output '::warning::API_ID/API_HASH missing or invalid. Preparing dependencies only; add your Telegram API secrets and run again for the EXE.' }
          git config --global user.email "nyxgram@users.noreply.github.com"
          git config --global user.name "Nyxgram Bot"
          Get-PSDrive C,D | Select-Object Name,Free,Used
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          sdk: ${{ env.SDK }}
      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0
      - uses: actions/cache/restore@v4
        id: thirdparty
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: nyx-windows-x64-thirdparty-${{ env.CACHE_KEY }}
          restore-keys: nyx-windows-x64-thirdparty-
      - uses: actions/cache/restore@v4
        id: libraries
        with:
          path: ${{ env.TBUILD }}\Libraries
          key: nyx-windows-x64-libraries-${{ env.CACHE_KEY }}
          restore-keys: nyx-windows-x64-libraries-
      - name: Prepare Windows libraries (first build may be long)
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
          GYP_MSVS_VERSION: 2022
        run: |
          cd %TBUILD%
          call nyxgram-desktop\Telegram\build\prepare\win.bat silent
      - name: Reduce cache size
        shell: pwsh
        run: |
          $files = Get-ChildItem "$env:TBUILD\Libraries" -Recurse -File | Where-Object { $_.Extension -in '.pdb','.pch','.obj' }
          $files | Remove-Item -Force
          Write-Output "Removed $($files.Count) intermediate files; static libraries retained."
      - uses: actions/cache/save@v4
        if: steps.thirdparty.outputs.cache-hit != 'true'
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.thirdparty.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: steps.libraries.outputs.cache-hit != 'true'
        with:
          path: ${{ env.TBUILD }}\Libraries
          key: ${{ steps.libraries.outputs.cache-primary-key }}
      - name: Compile Nyxgram Desktop Release
        if: env.BUILD_APP == 'true'
        run: |
          cd %TBUILD%\nyxgram-desktop\Telegram
          call configure.bat x64 -D TDESKTOP_API_TEST=OFF -D TDESKTOP_API_ID=%API_ID% -D TDESKTOP_API_HASH=%API_HASH% -D CMAKE_CONFIGURATION_TYPES=Release -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=
          if errorlevel 1 exit /b 1
          cmake --build ..\out --config Release --target Telegram --parallel 4
      - name: Package separate portable client
        if: env.BUILD_APP == 'true'
        shell: pwsh
        run: |
          $repo = "$env:TBUILD\nyxgram-desktop"
          $out = "$repo\out\Release"
          $dist = "$env:GITHUB_WORKSPACE\Nyxgram-Desktop"
          New-Item -ItemType Directory -Path $dist | Out-Null
          if (!(Test-Path "$out\Nyxgram.exe")) { throw 'Nyxgram.exe not found' }
          Copy-Item "$out\Nyxgram.exe" $dist
          Get-ChildItem "$out\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $dist
          foreach ($dir in @('modules','plugins','platforms')) { if (Test-Path "$out\$dir") { Copy-Item "$out\$dir" $dist -Recurse } }
          Copy-Item "$repo\LICENSE","$repo\LEGAL" $dist
          Copy-Item "$repo\NYXGRAM_PORTABLE_README.txt" "$dist\README.txt"
          Copy-Item "$repo\Telegram\Resources\nyx\icons" "$dist\icons" -Recurse
          "Nyxgram Desktop 0.2.1`nSource commit: $env:GITHUB_SHA`nSource: https://github.com/shadow1-ui/nyxgram-desktop`nWindows x64 Release; unsigned; official updates disabled." | Set-Content "$dist\BUILD-INFO.txt"
      - uses: actions/upload-artifact@v4
        if: env.BUILD_APP == 'true'
        with:
          name: Nyxgram-Desktop-${{ github.run_number }}-Windows-x64
          path: Nyxgram-Desktop/
          retention-days: 30
      - name: Summarize actual result
        shell: pwsh
        run: |
          if ($env:BUILD_APP -eq 'true') {
            'Windows x64 client compiled. Download the portable artifact. On-device testing is still required.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Dependencies only: no EXE was built. Add repository API_ID/API_HASH secrets and run with dependencies_only=false to build the app.' >> $env:GITHUB_STEP_SUMMARY
          }
